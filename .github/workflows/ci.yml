name: Backend CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sinaloa
          POSTGRES_PASSWORD: sinaloa_test
          POSTGRES_DB: sinaloa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sinaloa -d sinaloa_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:postgres
        env:
          DATABASE_URL: postgresql://sinaloa:sinaloa_test@127.0.0.1:5432/sinaloa_test
      - run: npm audit --omit=dev
