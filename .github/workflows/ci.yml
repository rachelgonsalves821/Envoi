name: Backend CI

on:
  push:
    branches: [main, codex/deployment-recovery, integration/agent-native]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A step, not a job service: services are pulled before any step, so a throttled registry
      # there fails the job with no retry. Mirror, then Docker Hub, bounded; fails visibly.
      - name: Start PostgreSQL
        run: bash scripts/ci-start-postgres.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - run: node --test scanner/*.test.js
      - run: node scripts/stress-local.mjs
      - run: npm run test:frontend
      - run: npm run test:sdk:typescript
      - run: npx vitest run --config integrations/vitest.config.ts
        env:
          ENVOI_P2_SERVER_ENTRY: ${{ github.workspace }}/src/server.js
      - run: npm run test:sdk:python
      - run: npm run build
      # Committed generated files (web/**, release.json, connector bundles) must equal a fresh build, so the
      # hosted bundle hash checked at a gate is provably built from this source.
      - name: Generated files match their sources
        run: |
          if [ -n "$(git status --porcelain)" ]; then git status --porcelain; git diff --stat; exit 1; fi
      - run: npm run cf:check
      - name: Build actual production container
        # The Dockerfile stays on node:22-alpine; pre-load that official image so the build uses the
        # local copy. Both anonymous registries throttle shared runners, so retry the mirror, then Docker Hub.
        run: |
          pulled=
          for attempt in 1 2 3 4; do
            if docker pull public.ecr.aws/docker/library/node:22-alpine; then
              docker tag public.ecr.aws/docker/library/node:22-alpine node:22-alpine; pulled=1; break
            fi
            if docker pull node:22-alpine; then pulled=1; break; fi
            sleep $((attempt * 15))
          done
          test -n "$pulled"
          docker build -f Dockerfile.cloudflare -t sinaloa-ci .
      - name: Verify missing production configuration fails closed
        run: |
          set +e
          output=$(timeout 20s docker run --rm sinaloa-ci 2>&1)
          result=$?
          set -e
          printf '%s\n' "$output"
          test "$result" -ne 0
          test "$result" -ne 124
          printf '%s\n' "$output" | grep -q 'Invalid production configuration'
      - run: npm run test:postgres
        env:
          DATABASE_URL: postgresql://sinaloa:sinaloa_test@127.0.0.1:5432/sinaloa_test
      - run: npm audit --omit=dev
      - run: npm audit --audit-level=high
      - name: Stop PostgreSQL
        if: always()
        run: docker rm -f envoi-ci-postgres || true
