name: One-off beta container image 414cd78

on:
  push:
    branches: [codex/release-image-414cd78]

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 414cd783ee80ac19229695d9a46a6950063fbe4e
      - name: Verify exact approved source
        run: test "$(git rev-parse HEAD)" = 414cd783ee80ac19229695d9a46a6950063fbe4e
      - name: Pull base image with retry
        run: |
          for attempt in 1 2 3 4; do
            if docker pull public.ecr.aws/docker/library/node:22-alpine; then
              docker tag public.ecr.aws/docker/library/node:22-alpine node:22-alpine
              exit 0
            fi
            if docker pull node:22-alpine; then exit 0; fi
            sleep $((attempt * 15))
          done
          exit 1
      - name: Build approved container
        run: |
          docker build -f Dockerfile.cloudflare \
            --label org.opencontainers.image.revision=414cd783ee80ac19229695d9a46a6950063fbe4e \
            -t envoi-ui:414cd78 .
          docker image inspect envoi-ui:414cd78 \
            --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' \
            | grep -Fx 414cd783ee80ac19229695d9a46a6950063fbe4e
      - name: Save and hash image
        run: |
          docker save -o image.tar envoi-ui:414cd78
          sha256sum image.tar > image.tar.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: envoi-ui-image-414cd78
          path: |
            image.tar
            image.tar.sha256
          retention-days: 1
          compression-level: 1
