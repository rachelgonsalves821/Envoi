name: One-off beta container image 414cd78

on:
  push:
    branches: [codex/release-image-414cd78]

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 414cd783ee80ac19229695d9a46a6950063fbe4e
      - name: Verify exact approved source
        run: test "$(git rev-parse HEAD)" = 414cd783ee80ac19229695d9a46a6950063fbe4e
      - name: Authenticate to temporary Cloudflare registry access
        env:
          CF_REGISTRY_PUSH_PASSWORD: ${{ secrets.CF_REGISTRY_PUSH_414CD78 }}
        run: |
          test -n "$CF_REGISTRY_PUSH_PASSWORD"
          printf '%s' "$CF_REGISTRY_PUSH_PASSWORD" | docker login registry.cloudflare.com --username v1 --password-stdin
      - name: Pull base image with retry
        run: |
          for attempt in 1 2 3 4; do
            if docker pull public.ecr.aws/docker/library/node:22-alpine; then
              docker tag public.ecr.aws/docker/library/node:22-alpine node:22-alpine
              exit 0
            fi
            if docker pull node:22-alpine; then exit 0; fi
            sleep $((attempt * 15))
          done
          exit 1
      - name: Build and push approved container
        run: |
          image=registry.cloudflare.com/54a5d6c680bd813fa60f8e088b098b8d/sinaloa-beta-release:signup-414cd78
          docker build -f Dockerfile.cloudflare -t "$image" .
          docker push "$image"
